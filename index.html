<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PA3 – AR Hit-Testing – 242322</title>
  <link rel="icon" href="data:,">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" } }
  </script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    header { padding: 12px 16px; }
    h1 { font-size: 1.1rem; margin: 0 0 8px; }
    #fallback { color: #b00020; font-weight: 600; }
    #start { font-size: 1rem; padding: 10px 18px; }
    /* DOM overlay root: hidden until the AR session starts */
    #overlay { display: none; font-family: monospace; color: #fff; }
    #panel { display: inline-block; margin: 8px; padding: 8px 12px; background: rgba(0,0,0,.65);
             border-radius: 8px; font-size: 14px; }
    #status { white-space: pre-line; }
    #tracking { color: #ffb4a9; font-weight: 700; margin-top: 4px; }
    #panel button { font-size: 1rem; padding: 8px 14px; margin: 6px 6px 0 0; }
  </style>
</head>
<body>
  <header>
    <h1>AR product preview – 242322 – Coffee table (multi ≤5, 8°, faces user)</h1>
    <p id="fallback" hidden></p>
  </header>

  <!-- #overlay is the DOM-overlay root. Only #panel blocks XR "select" (see index.js). -->
  <div id="overlay">
    <div id="panel">
      <div id="status"></div>
      <div id="tracking" hidden>Tracking lost — move the phone slowly</div>
      <button id="clear">Clear</button>
      <button id="stop">STOP AR</button>
    </div>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
